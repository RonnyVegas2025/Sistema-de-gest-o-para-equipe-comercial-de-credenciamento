# Configuração do projeto Supabase — CRM Comercial de Credenciamento Vegas.
#
# Vale para o ambiente LOCAL (`supabase start`) e para o que o CLI precisa saber
# ao operar o projeto remoto. Configuração do projeto hospedado que não aparece
# aqui é feita no painel — ver README, seção "Variáveis de ambiente".
#
# O projeto é novo e independente do Painel ADM (D-001): sem schema
# compartilhado, sem Auth compartilhada.

# Nome local do stack. A referência do projeto hospedado
# (oywwcwkkwsrgzgkegifn) fica em SUPABASE_PROJECT_REF, no .env.local.
project_id = "crm-credenciamento"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Teto de linhas por request. Toda listagem do CRM é paginada; um valor alto
# aqui só serviria para mascarar consulta sem paginação.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# CONFIRMADO contra o projeto hospedado: Postgres 17.6.1.155, região sa-east-1
# (South America, São Paulo). Acompanha o major do projeto — divergir faz a
# migration passar no local e falhar no deploy.
major_version = 17

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

# Captura de e-mail local — recuperação de senha e afins caem aqui, não numa
# caixa real, enquanto não houver SMTP configurado.
[local_smtp]
enabled = true
port = 54324

# Storage desabilitado: nenhum requisito da Sprint 1 sobe arquivo. Ligar quando
# houver decisão registrada — anexo de visita é assunto de sprint posterior.
[storage]
enabled = false

[auth]
enabled = true
site_url = "env(NEXT_PUBLIC_SITE_URL)"
# Só o stack LOCAL lê esta lista. O projeto hospedado tem a sua própria, no
# painel (Authentication > URL Configuration) — mantida em sincronia à mão, com
# a URL de produção e o curinga de preview. Ver README, seção "Deploy".
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Cadastro público desligado (D-009): usuário do CRM nasce por ação de
# administrador, através da Edge Function admin-create-user. Recuperação de
# senha continua pública.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
# Troca de e-mail exige confirmação nos dois endereços — sem isto, um endereço
# digitado errado sequestra a conta em silêncio.
double_confirm_changes = true
# Sem SMTP configurado ainda; a criação de usuário usa senha temporária, não
# convite por e-mail. Ver o flag USER_INVITE_EMAIL_ENABLED quando o SMTP existir.
enable_confirmations = false
secure_password_change = true

[auth.email.template.recovery]
subject = "Redefinição de senha — CRM Credenciamento Vegas"

[edge_runtime]
enabled = true
# oneshot: a função reinicia a cada request em desenvolvimento, refletindo a
# edição sem restart manual.
policy = "oneshot"
