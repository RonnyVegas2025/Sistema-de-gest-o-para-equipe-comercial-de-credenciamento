name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Verificação de tipos
        run: npm run typecheck

      - name: Testes de unidade
        run: npm run test -- --run

      # Chaves de ambiente de desenvolvimento. A anon key é pública por
      # natureza — a proteção do dado vem da RLS. A service role key não
      # entra no CI em hipótese alguma.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Verificar vazamento da service role key no bundle
        run: |
          if grep -rl "SUPABASE_SERVICE_ROLE_KEY" .next/static 2>/dev/null; then
            echo "::error::Referência à service role key encontrada no bundle client."
            exit 1
          fi
          echo "Nenhuma referência à service role key no bundle client."
